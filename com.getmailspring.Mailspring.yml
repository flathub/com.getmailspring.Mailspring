app-id: com.getmailspring.Mailspring
runtime: org.freedesktop.Platform
runtime-version: '25.08'
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: mailspring
separate-locales: false
rename-icon: mailspring
rename-appdata-file: mailspring.appdata.xml
rename-desktop-file: Mailspring.desktop

finish-args:
  # Electron apps need this to work properly
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri

  # Secret storage
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6

  # System tray
  - --talk-name=org.kde.StatusNotifierWatcher

  # Battery awareness
  - --system-talk-name=org.freedesktop.UPower

modules:
  # Dependency of MailCore2 and mailsync. Dynamically linked.
  - name: libctemplate
    buildsystem: autotools
    builddir: true
    sources:
      - type: archive
        url: https://github.com/OlafvdSpek/ctemplate/archive/refs/tags/ctemplate-2.4.tar.gz
        sha256: ccc4105b3dc51c82b0f194499979be22d5a14504f741115be155bd991ee93cfa
        x-checker-data:
          type: anitya
          project-id: 376
          stable-only: true
          url-template: https://github.com/OlafvdSpek/ctemplate/archive/refs/tags/ctemplate-$version.tar.gz
    cleanup:
      - /bin # template-converter, make_tpl_varnames_h, diff_tpl_auto_escape
      - /lib/*_nothreads.*

  # Dependency of mailsync. dlopens libtidy.so.5 at runtime.
  - name: libtidy
    buildsystem: cmake
    builddir: true
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    license-files:
      - README/LICENSE.md
    sources:
      - type: archive
        url: https://github.com/htacg/tidy-html5/archive/refs/tags/5.8.0.tar.gz
        sha256: 59c86d5b2e452f63c5cdb29c866a12a4c55b1741d7025cf2f3ce0cde99b0660e
        x-checker-data:
          type: anitya
          project-id: 13267
          stable-only: true
          url-template: https://github.com/htacg/tidy-html5/archive/refs/tags/$version.tar.gz
    cleanup:
      - /bin # tidy

  # Dependency of mailsync. Dynamically linked.
  - name: libcares
    buildsystem: cmake
    builddir: true
    config-opts:
      - -DCARES_BUILD_TOOLS=Off
    sources:
      - type: archive
        url: https://github.com/c-ares/c-ares/releases/download/v1.34.6/c-ares-1.34.6.tar.gz
        sha256: 912dd7cc3b3e8a79c52fd7fb9c0f4ecf0aaa73e45efda880266a2d6e26b84ef5
        x-checker-data:
          type: anitya
          project-id: 5840
          stable-only: true
          url-template: https://github.com/c-ares/c-ares/releases/download/v$version/c-ares-$version.tar.gz

  # Dependency of mailsync. Executed by StanfordCppLib logs at runtime when an error occured.
  - name: addr2line
    buildsystem: autotools
    builddir: true
    no-make-install: true
    sources:
      - type: archive
        url: https://ftp.gnu.org/pub/gnu/binutils/binutils-2.46.0.tar.gz
        sha256: 8608fe44ab7de645f6ad0a898313b75338842490d609adb85c9fb2827c376af2
        x-checker-data:
          type: anitya
          project-id: 7981
          stable-only: true
          url-template: https://ftp.gnu.org/pub/gnu/binutils/binutils-$version.tar.gz
    post-install:
      - install -Dm755 binutils/addr2line /app/bin/addr2line

  # Dependency of libsasl2. Dynamically linked if present at buildtime. Required for libgs2.so and libgssapiv2.so
  - name: libkrb5
    buildsystem: autotools
    builddir: true
    subdir: src
    license-files:
      - NOTICE
    sources:
      - type: archive
        url: https://kerberos.org/dist/krb5/1.22/krb5-1.22.2.tar.gz
        sha256: 3243ffbc8ea4d4ac22ddc7dd2a1dc54c57874c40648b60ff97009763554eaf13
        x-checker-data:
          type: anitya
          project-id: 13287
          stable-only: true
          url-template: https://kerberos.org/dist/krb5/$major.$minor/krb5-$major.$minor.$patch.tar.gz
    cleanup:
      - /bin
      - /sbin

  # Dependency of mailsync. Dynamically linked. We use this over the system libsasl2 because we need additional auth mechanisms.
  - name: libsasl2
    buildsystem: autotools
    builddir: true
    build-options:
      cflags: --std=gnu17 -DHAVE_TIME_H=1
    config-opts:
      - --enable-login      # liblogin.so, disabled by default, required for some SMTP servers
      - --enable-ntlm       # libntlm.so, disabled by default, required for Microsoft 365 accounts
      - --with-gss_impl=mit # Use MIT Kerberos for GSSAPI support, which we built above.
    sources:
      - type: archive
        url: https://github.com/cyrusimap/cyrus-sasl/releases/download/cyrus-sasl-2.1.28/cyrus-sasl-2.1.28.tar.gz
        sha256: 7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c
        x-checker-data:
          type: anitya
          project-id: 13280
          stable-only: true
          url-template: https://github.com/cyrusimap/cyrus-sasl/releases/download/cyrus-sasl-$version/cyrus-sasl-$version.tar.gz
      - type: patch
        path: patches/libsasl2-time.patch
    cleanup:
      - /sbin

  - name: Mailspring
    buildsystem: simple
    sources:
      - type: git
        url: https://github.com/Foundry376/Mailspring.git
        tag: 1.19.1
        commit: 66f9e225f8d504aac03f952d5cc83c56d9d0cf3a
      - type: file
        path: build.sh
      - type: patch
        paths:
          - patches/libetpan-mailstream_ssl.patch
          - patches/libmailcore2-cmake.patch
          - patches/libmailcore2-zip.patch
          - patches/mailsync-cmake.patch
          - patches/mailspring-gruntfile.patch
          - patches/mailspring-postinstall.patch
          - patches/mailspring-package.patch
      - type: file
        path: mailspring.sh
      - generated-sources.json
    build-options:
      prepend-path: /usr/lib/sdk/node24/bin
      env:
        # https://github.com/flatpak/flatpak-builder-tools/tree/master/node
        XDG_CACHE_HOME: /run/build/Mailspring/flatpak-node/cache
        npm_config_cache: /run/build/Mailspring/flatpak-node/npm-cache
        npm_config_offline: 'true'
    build-commands:
      - ./build.sh
    cleanup:
      - /bin/libetpan-config
      - /share/mailspring/chrome-sandbox # Not needed, we use zypak

cleanup:
  - /include
  - /share/doc
  - /share/man
  - /share/examples
  - /lib/cmake
  - /lib/pkgconfig
  - '*.a'
  - '*.la'
